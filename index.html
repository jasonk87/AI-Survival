<html lang="en">

    <title>Robot Sandbox AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Press Start 2P', cursive;
      }
      /* For crisper scaling of pixel art if it were images */
      .pixelated {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }

      /* Rain effect */
      .rain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 20;
        pointer-events: none;
      }
      .rain::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(
          transparent,
          rgba(173, 216, 230, 0.5) 50%,
          transparent
        );
        background-size: 2px 20px;
        animation: rain-fall 0.25s linear infinite;
        opacity: 0.5;
      }

      @keyframes rain-fall {
        from {
          transform: translateY(-20px);
        }
        to {
          transform: translateY(0px);
        }
      }

      /* Snow effect */
      .snow {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 20;
        pointer-events: none;
      }
      .snowflake {
        position: absolute;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
        animation: snow-fall linear infinite;
      }
      @keyframes snow-fall {
        0% {
          transform: translateY(-10px) translateX(0);
        }
        100% {
          transform: translateY(calc(100vh - 10px)) translateX(20px);
        }
      }
    </style>
